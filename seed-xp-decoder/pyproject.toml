[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "seedxp"
version = "0.1.0"
description = "Decode per-skill experience tables from a local SEED (Klang Games) installation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
seedxp = "seedxp.cli:main"

[tool.setuptools]
packages = ["seedxp"]
